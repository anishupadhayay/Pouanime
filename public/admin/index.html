<!doctype html>
<!-- admin/index.html — administrator sign-in -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0d0d12"><title>Admin sign in — Stream</title><link rel="stylesheet" href="/admin/css/admin.css"><script defer src="/admin/js/admin-api.js"></script><script defer src="/admin/js/admin-auth.js"></script></head><body><main class="admin-login-wrap"><section class="admin-login"><a class="admin-brand" href="/"><span class="admin-brand-mark"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.7c0-.9 1-1.4 1.7-.9l10 6.1a1.3 1.3 0 0 1 0 2.2l-10 6.1c-.8.5-1.7 0-1.7-.9z"/></svg></span><span>Stream <span style="color:var(--admin-accent)">Admin</span></span></a><h1>Welcome back.</h1><p>Sign in with your administrator account to manage the catalogue.</p><div class="admin-error admin-hidden" id="login-error" role="alert"></div><form id="admin-login-form"><div class="admin-field"><label class="admin-label-text" for="email">Email</label><input class="admin-input" id="email" name="email" type="email" autocomplete="username" maxlength="254" required></div><div class="admin-field"><label class="admin-label-text" for="password">Password</label><input class="admin-input" id="password" name="password" type="password" autocomplete="current-password" maxlength="72" required></div><button class="admin-button" type="submit">Sign in to dashboard <span>→</span></button></form><p class="admin-subtle" style="margin:20px 0 0;text-align:center"><a href="/" style="color:#ffad8b">← Return to Stream</a></p></section></main><div class="admin-toast-region" id="admin-toast-region" aria-live="polite"></div></body></html>
